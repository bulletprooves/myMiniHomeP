<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

    <title>Donggurami ver1.2.5</title>

    <style>
      html, body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }

      #unity-container {
        width: 100vw;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      #unity-canvas {
        aspect-ratio: 16 / 9;
        width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100dvh, calc(100vw * 9 / 16));
        background: url('Build/Donggurami-WebGL-Build.jpg') center / cover;
      }

      #rotate-toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        z-index: 9999;

        display: none;

        width: calc(100% - 48px);
        max-width: 420px;
        box-sizing: border-box;

        padding: 16px 20px;
        border-radius: 16px;

        background: rgba(0, 0, 0, 0.82);
        color: #fff;

        font-family: Arial, sans-serif;
        font-size: 16px;
        line-height: 1.45;
        text-align: center;

        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }

      #rotate-toast .title {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      #rotate-toast .sub {
        font-size: 14px;
        opacity: 0.9;
      }

      #rotate-toast.show {
        display: block;
      }

      #portrait-dim {
        position: fixed;
        inset: 0;
        z-index: 9998;

        display: none;

        background: rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }

      #portrait-dim.show {
        display: block;
      }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    </div>

    <div id="portrait-dim"></div>

    <div id="rotate-toast">
      <div class="title">Please rotate your device.</div>
      <div class="sub">기기를 가로로 돌려주세요.</div>
    </div>

    <script src="Build/Donggurami-WebGL-Build.loader.js"></script>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const rotateToast = document.querySelector("#rotate-toast");
      const portraitDim = document.querySelector("#portrait-dim");

      function isMobileDevice() {
        return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      }

      function isPortrait() {
        return window.innerHeight > window.innerWidth;
      }

      function updateRotateToast() {
        const shouldShow = isMobileDevice() && isPortrait();

        if (shouldShow) {
          rotateToast.classList.add("show");
          portraitDim.classList.add("show");
        } else {
          rotateToast.classList.remove("show");
          portraitDim.classList.remove("show");
        }
      }

      window.addEventListener("resize", updateRotateToast);
      window.addEventListener("orientationchange", function () {
        setTimeout(updateRotateToast, 250);
      });

      updateRotateToast();

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/Donggurami-WebGL-Build.data",
        frameworkUrl: "Build/Donggurami-WebGL-Build.framework.js",
        codeUrl: "Build/Donggurami-WebGL-Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DavidGam",
        productName: "Donggurami",
        productVersion: "1.2.5",
        // matchWebGLToCanvasSize: false,
        // devicePixelRatio: 1,
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
